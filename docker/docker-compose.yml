version: '3.8'

services:
  finguard-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: finguard-mlops-container
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - PYTHONPATH=/app
    restart: always
